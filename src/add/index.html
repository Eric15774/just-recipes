<script>
/* ---------- Settings ---------- */
var REPO = "Eric15774/just-recipes";
var BRANCH = "main";
var RECIPE_FOLDER = "src/recipes";
var CATEGORIES = [
  "Appetizers and Starters", "Baking and Desserts", "Beverages", "Breads and Doughs",
  "Breakfast and Brunch", "Cookies Etc.", "Experimental", "Garnishes and Sauces",
  "Holiday and Special Occasions", "Main Courses", "Pizza", "Salads and Side Dishes",
  "Super Sweets", "Vegetarian and Vegan"
];
var OCR_SCRIPT = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
var DRAFT_KEY = "add-recipe-draft-v1";

/* ---------- Helpers ---------- */
function $(id) { return document.getElementById(id); }
var FIELDS = ["raw", "title", "category", "categoryOther", "tags", "prep", "cook", "servings", "ingredients", "directions", "notes"];

function slugify(s) {
  return String(s).toLowerCase()
    .replace(/[’']/g, "")
    .replace(/&/g, " and ")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "");
}

function titleCase(s) {
  var small = /^(a|an|and|at|but|by|for|in|of|on|or|the|to|with)$/;
  return s.toLowerCase().split(/\s+/).map(function (w, i) {
    if (i > 0 && small.test(w)) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(" ");
}

/* ---------- Text cleanup ---------- */
var FRACTIONS = {
  "½": "1/2", "⅓": "1/3", "⅔": "2/3", "¼": "1/4", "¾": "3/4",
  "⅕": "1/5", "⅖": "2/5", "⅗": "3/5", "⅘": "4/5", "⅙": "1/6",
  "⅚": "5/6", "⅛": "1/8", "⅜": "3/8", "⅝": "5/8", "⅞": "7/8"
};

function normalize(text) {
  text = text.replace(/\r\n?/g, "\n");
  // "1½" -> "1 1/2", "½" -> "1/2"
  text = text.replace(/(\d)?([¼-¾⅐-⅞])/g, function (m, d, f) {
    return (d ? d + " " : "") + (FRACTIONS[f] || f);
  });
  text = text.replace(/⁄/g, "/");                 // fraction slash
  text = text.replace(/[‘’]/g, "'").replace(/[“”]/g, '"');
  text = text.replace(/[–—]/g, "-");
  text = text.replace(/ /g, " ");
  text = text.replace(/[ \t]+/g, " ");
  return text;
}

// Common photo-reading slips in quantities: "l/2" -> "1/2", "I cup" -> "1 cup"
function fixQuantity(line) {
  return line
    .replace(/^[lI|](?=\s*\/\s*\d)/, "1")
    .replace(/^[lI|](?=\s+(cups?|c\.|tbsp|tsp|tablespoons?|teaspoons?|lbs?|pounds?|oz|ounces?|pkg|package|can|stick|egg|large|small|medium|quart|pint)\b)/i, "1")
    .replace(/(\d)\s*\/\s*(\d)/g, "$1/$2");
}

function stripBullet(line) {
  return line.replace(/^\s*([-*•▪●·‣⁃o]|[□☐])\s+/, "").trim();
}

function fixTemps(s) {
  return s
    .replace(/(\d{3})\s*(?:°|\s?degrees?|deg\.?)\s*(?:\s*(?:F\b|Fahrenheit\b))?/gi, "$1°F")
    .replace(/(\d{3})\s?F\b/g, "$1°F")
    .replace(/°F°F/g, "°F");
}

/* ---------- Recipe parsing ---------- */
var RX = {
  ingHead: /^(ingredients?|you('ll| will) need|what you('ll)? need)\s*:?\s*$/i,
  dirHead: /^(directions?|instructions?|method|preparation|steps|procedure|how to make( it)?|to make)\s*:?\s*$/i,
  noteHead: /^(notes?|tips?|cook'?s notes?|variations?|hints?)\s*:?\s*$/i,
  prep: /^\s*prep(aration)?\.?( time)?\s*[:\-]?\s*(.+)$/i,
  cook: /^\s*(cook|bake|baking|cooking)( time)?\s*[:\-]\s*(.+)$/i,
  cook2: /^\s*(cook|bake|baking|cooking) time\s*[:\-]?\s*(.+)$/i,
  total: /^\s*(total|ready in)( time)?\s*[:\-]?\s*(.+)$/i,
  serves: /^\s*(serves|servings?|yields?|makes|yield)\s*[:\-]?\s*(.+)$/i,
  qty: /^(\d|[lI](?=\s*\/\s*\d)|a\s|an\s|one\s|two\s|three\s|four\s|half\s|pinch|dash|few|several|some\s|salt|pepper|\(?\d)/i,
  unit: /\b(cups?|c\.|tbsp|tbs|tbl|tsp|tablespoons?|teaspoons?|lbs?|pounds?|oz|ounces?|pkg|packages?|cans?|sticks?|quarts?|qts?|pints?|pt|grams?|g|ml|liters?|cloves?|dash|pinch|slices?|envelopes?|jars?|boxes?|bunch)\b/i,
  verbStart: /^(add|bake|beat|blend|boil|bring|brown|chill|chop|combine|cook|cool|cover|cream|cut|dissolve|divide|drain|drop|fold|fry|grease|heat|in a|knead|let|melt|mix|place|pour|preheat|put|reduce|refrigerate|remove|roll|saute|season|serve|set|shape|simmer|sift|slice|sprinkle|spread|stir|store|top|toss|transfer|turn|whisk|when|while|after|then|once)\b/i,
  stepNum: /^\s*(step\s*)?(\d{1,2})\s*[.):\-]\s+/i
};

function looksLikeIngredient(line) {
  if (line.length > 80) return false;
  if (RX.verbStart.test(line)) return false;
  if (RX.qty.test(line)) return true;
  if (RX.unit.test(line) && line.length < 50) return true;
  return false;
}

function sentenceEnd(s) { return /[.!?)]["']?$/.test(s.trim()); }

function parseRecipe(text) {
  var out = { title: "", prep: "", cook: "", servings: "", ingredients: [], directions: [], notes: [] };
  var lines = normalize(text).split("\n").map(function (l) { return l.trim(); });

  // Pull out metadata lines wherever they appear
  var body = [];
  lines.forEach(function (l) {
    var m;
    if (!l) { body.push(""); return; }
    if ((m = l.match(RX.prep)) && l.length < 60) { out.prep = out.prep || cleanTime(m[3]); return; }
    if ((m = l.match(RX.cook2)) && l.length < 60) { out.cook = out.cook || cleanTime(m[2]); return; }
    if ((m = l.match(RX.cook)) && l.length < 40) { out.cook = out.cook || cleanTime(m[3]); return; }
    if ((m = l.match(RX.total)) && l.length < 60) { return; }
    if ((m = l.match(RX.serves)) && l.length < 50 && !/\bfor\b.*\bminutes?\b/i.test(l)) {
      out.servings = out.servings || m[2].replace(/[.:]$/, "").trim();
      return;
    }
    body.push(l);
  });

  // Title: first real line that is not a heading
  for (var i = 0; i < body.length; i++) {
    var l = body[i];
    if (!l) continue;
    if (RX.ingHead.test(l) || RX.dirHead.test(l) || RX.noteHead.test(l)) break;
    if (l.length <= 70 && !looksLikeIngredient(l)) {
      out.title = (l === l.toUpperCase() && /[A-Z]/.test(l)) ? titleCase(l) : l;
      out.title = out.title.replace(/[:.]$/, "");
      body.splice(i, 1);
    }
    break;
  }

  // Split into sections using headings if present
  var sections = { pre: [], ing: [], dir: [], note: [] };
  var current = "pre", sawHeading = false;
  body.forEach(function (l) {
    if (RX.ingHead.test(l)) { current = "ing"; sawHeading = true; return; }
    if (RX.dirHead.test(l)) { current = "dir"; sawHeading = true; return; }
    if (RX.noteHead.test(l)) { current = "note"; sawHeading = true; return; }
    // "Note: something" on one line
    var nm = l.match(/^(notes?|tip)\s*:\s*(.+)$/i);
    if (nm) { sections.note.push(nm[2]); return; }
    sections[current].push(l);
  });

  if (!sawHeading || (!sections.ing.length && !sections.dir.length)) {
    // No headings: ingredient-looking lines up top, everything after is directions
    var all = sections.pre.concat(sections.ing, sections.dir);
    sections = { pre: [], ing: [], dir: [], note: sections.note };
    var inDirections = false;
    all.forEach(function (l) {
      if (!inDirections && l && !looksLikeIngredient(l) && !/:$/.test(l)) {
        // A short non-ingredient line right after ingredients may be a wrapped ingredient
        var prev = sections.ing[sections.ing.length - 1];
        if (prev && /^[a-z(]/.test(l) && l.length < 40) { sections.ing.push(l); return; }
        if (sections.ing.length || RX.verbStart.test(l) || RX.stepNum.test(l) || l.length > 45) inDirections = true;
      }
      (inDirections ? sections.dir : sections.ing).push(l);
    });
  } else if (sections.pre.length) {
    // Text before the first heading: keep ingredient-looking lines, drop the rest (often a blurb)
    var lead = sections.pre.filter(function (l) { return l && looksLikeIngredient(l); });
    sections.ing = lead.concat(sections.ing);
  }

  out.ingredients = buildIngredients(sections.ing);
  out.directions = buildSteps(sections.dir);
  out.notes = buildSteps(sections.note);

  // If no cook time was given, take a bake/cook time from the directions
  if (!out.cook) {
    var joined = out.directions.join(" ");
    var cm = joined.match(/\b(bake|cook|roast|simmer|fry|broil)\b[^.]*?\b(\d+(?:\s*(?:-|to)\s*\d+)?)\s*(minutes?|mins?|hours?|hrs?)\b/i);
    if (cm) out.cook = cm[2].replace(/\s*to\s*/, "-").replace(/\s*-\s*/, "-") + " " + (/^h/i.test(cm[3]) ? "hr" : "min");
  }
  return out;
}

function cleanTime(s) {
  return s.replace(/\bminutes?\b|\bmins?\.?/gi, "min")
          .replace(/\bhours?\b|\bhrs?\.?/gi, "hr")
          .replace(/[.:]$/, "").trim();
}

function buildIngredients(lines) {
  var items = [];
  lines.forEach(function (raw) {
    if (!raw) return;
    var l = fixQuantity(stripBullet(raw));
    if (!l) return;
    var prev = items[items.length - 1];
    // Wrapped line from a photo: starts lowercase, no quantity, previous line not a subheading
    if (prev && !/:$/.test(prev) && /^[a-z(]/.test(l) && !RX.qty.test(l) && l.length < 45) {
      items[items.length - 1] = prev + " " + l;
      return;
    }
    items.push(l);
  });
  return items;
}

function buildSteps(lines) {
  var steps = [], buf = "";
  var numbered = lines.some(function (l) { return RX.stepNum.test(l); });
  function flush() { if (buf.trim()) steps.push(fixTemps(buf.trim())); buf = ""; }
  lines.forEach(function (raw) {
    if (!raw) { if (!numbered) flush(); return; }
    var l = stripBullet(raw);
    if (RX.stepNum.test(l)) { flush(); buf = l.replace(RX.stepNum, ""); return; }
    if (numbered) { buf += (buf ? " " : "") + l; return; }
    // Unnumbered: a line that follows a finished sentence starts a new step
    if (buf && sentenceEnd(buf)) flush();
    buf += (buf ? " " : "") + l;
  });
  flush();
  return steps.map(function (s) { return s.replace(/\s+/g, " ").replace(/\s+([.,;])/g, "$1"); });
}

/* ---------- Building the markdown file ---------- */
function yamlValue(s) {
  // Quote anything YAML could misread
  if (s === "") return '""';
  if (/^[\d.\-\/ ]+$/.test(s) || /[:#\[\]{},&*!|>'"%@`]/.test(s) || /^\s|\s$/.test(s)) {
    return '"' + s.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
  }
  return s;
}

function lines(id) {
  return $(id).value.split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
}

function currentCategory() {
  var v = $("category").value;
  return v === "__other" ? $("categoryOther").value.trim() : v;
}

function buildMarkdown() {
  var title = $("title").value.trim() || "Untitled Recipe";
  var tags = $("tags").value.split(",").map(function (t) { return t.trim().toLowerCase(); }).filter(Boolean);
  var fm = ["---", "layout: layouts/recipe.njk", "title: " + yamlValue(title),
            "category: " + yamlValue(currentCategory() || "Experimental"),
            "tags: [" + tags.map(function (t) { return /[,\[\]:#"']/.test(t) ? '"' + t.replace(/"/g, "") + '"' : t; }).join(", ") + "]"];
  if ($("prep").value.trim()) fm.push("prep: " + yamlValue($("prep").value.trim()));
  if ($("cook").value.trim()) fm.push("cook: " + yamlValue($("cook").value.trim()));
  if ($("servings").value.trim()) fm.push('servings: "' + $("servings").value.trim().replace(/"/g, "") + '"');
  fm.push("---");

  var md = fm.join("\n") + "\n\n## Ingredients\n\n";
  md += lines("ingredients").map(function (l) {
    l = stripBullet(l);
    if (/:$/.test(l) && l.length < 50) return "\n### " + l.replace(/:$/, "") + "\n";
    return "- " + l;
  }).join("\n").replace(/^\n/, "") + "\n";

  md += "\n## Directions\n\n";
  md += lines("directions").map(function (l, i) {
    return (i + 1) + ". " + stripBullet(l).replace(RX.stepNum, "");
  }).join("\n") + "\n";

  var notes = lines("notes");
  if (notes.length) md += "\n## Notes\n\n" + notes.map(function (n) { return "- " + stripBullet(n); }).join("\n") + "\n";
  return md.replace(/\n{3,}/g, "\n\n");
}

function filename() {
  return (slugify($("title").value) || "new-recipe") + ".md";
}

/* ---------- Existing recipes (for duplicate warning) ---------- */
var existing = null;
function loadExisting() {
  fetch("https://api.github.com/repos/" + REPO + "/contents/" + RECIPE_FOLDER + "?ref=" + BRANCH)
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (list) {
      existing = new Set((list || []).map(function (f) { return f.name; }));
      refresh();
    })
    .catch(function () {});
}

/* ---------- Screen updates ---------- */
function refresh() {
  var fn = filename();
  $("filename").textContent = fn;
  $("preview").textContent = buildMarkdown();

  var dup = existing && existing.has(fn);
  $("dupWarn").hidden = !dup;
  if (dup) $("dupWarn").textContent = "A recipe named " + fn + " is already on the site. Change the title if this is a different recipe.";

  var missing = [];
  if (!$("title").value.trim()) missing.push("a title");
  if (!lines("ingredients").length) missing.push("ingredients");
  if (!lines("directions").length) missing.push("directions");
  if ($("category").value === "__other" && !$("categoryOther").value.trim()) missing.push("a category name");
  $("checkWarn").hidden = !missing.length;
  if (missing.length) $("checkWarn").textContent = "Still needs " + missing.join(", ") + ".";
  saveDraft();
}

function fillForm(r) {
  $("title").value = r.title;
  $("prep").value = r.prep;
  $("cook").value = r.cook;
  $("servings").value = r.servings;
  $("ingredients").value = r.ingredients.join("\n");
  $("directions").value = r.directions.join("\n");
  $("notes").value = r.notes.join("\n");
  refresh();
}

/* ---------- Draft saving (so a closed tab is not lost work) ---------- */
function saveDraft() {
  try {
    var d = {};
    FIELDS.forEach(function (f) { d[f] = $(f).value; });
    localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
  } catch (e) {}
}
function loadDraft() {
  try {
    var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
    if (!d) return;
    FIELDS.forEach(function (f) { if (d[f] != null) $(f).value = d[f]; });
    $("categoryOther").hidden = $("category").value !== "__other";
  } catch (e) {}
}

/* ---------- Photo reading ---------- */
var ocrLoading = null;
function loadOcr() {
  if (window.Tesseract) return Promise.resolve();
  if (ocrLoading) return ocrLoading;
  ocrLoading = new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    s.src = OCR_SCRIPT;
    s.onload = resolve;
    s.onerror = function () { ocrLoading = null; reject(new Error("Could not load the photo reader. Check your connection.")); };
    document.head.appendChild(s);
  });
  return ocrLoading;
}

// Shrink big phone photos and boost contrast, which helps the reader a lot
function prepareImage(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var max = 2200, scale = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      var ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, c.width, c.height);
      var data = ctx.getImageData(0, 0, c.width, c.height), p = data.data;
      for (var i = 0; i < p.length; i += 4) {
        var g = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
        g = Math.max(0, Math.min(255, (g - 128) * 1.5 + 140));
        p[i] = p[i + 1] = p[i + 2] = g;
      }
      ctx.putImageData(data, 0, 0);
      URL.revokeObjectURL(url);
      resolve(c);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("That photo could not be opened.")); };
    img.src = url;
  });
}

function handlePhotos(files) {
  files = Array.prototype.slice.call(files || []);
  if (!files.length) return;
  var status = $("ocrStatus"), bar = $("progress");
  files.forEach(function (f) {
    var t = document.createElement("img");
    t.src = URL.createObjectURL(f);
    t.alt = "Recipe photo";
    $("thumbs").appendChild(t);
  });
  bar.hidden = false; bar.value = 0;
  status.textContent = "Getting the photo reader ready (first time takes a moment)...";
  $("fillBtn").disabled = true;

  var texts = [], worker;
  loadOcr()
    .then(function () {
      return Tesseract.createWorker("eng", 1, {
        logger: function (m) {
          if (m.status === "recognizing text") {
            bar.value = (texts.length + m.progress) / files.length;
            status.textContent = "Reading photo " + (texts.length + 1) + " of " + files.length + "...";
          }
        }
      });
    })
    .then(function (w) {
      worker = w;
      return files.reduce(function (chain, f) {
        return chain.then(function () { return prepareImage(f); })
                    .then(function (canvas) { return worker.recognize(canvas); })
                    .then(function (res) { texts.push(res.data.text.trim()); });
      }, Promise.resolve());
    })
    .then(function () {
      var raw = $("raw");
      raw.value = (raw.value.trim() ? raw.value.trim() + "\n\n" : "") + texts.join("\n\n");
      bar.value = 1;
      status.textContent = "Done. Check the text below for misread words, then tap Fill in the form.";
      fillForm(parseRecipe(raw.value));
    })
    .catch(function (e) {
      status.textContent = (e && e.message) || "Something went wrong reading the photo.";
    })
    .then(function () {
      if (worker) worker.terminate();
      bar.hidden = true;
      $("fillBtn").disabled = false;
      $("camera").value = ""; $("library").value = "";
    });
}

/* ---------- Saving ---------- */
function download() {
  var blob = new Blob([buildMarkdown()], { type: "text/markdown" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename();
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  $("saveStatus").textContent = "Saved " + filename() + " to your Downloads.";
}

function copyText() {
  var md = buildMarkdown();
  var done = function () { $("saveStatus").textContent = "Copied. Paste it into a new file named " + filename() + "."; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(md).then(done, fallback);
  } else fallback();
  function fallback() {
    var t = document.createElement("textarea");
    t.value = md; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); done(); } catch (e) { $("saveStatus").textContent = "Copy did not work here. Use Download instead."; }
    t.remove();
  }
}

function openGitHub() {
  if (existing && existing.has(filename()) && !confirm(filename() + " already exists. Open GitHub anyway?")) return;
  var url = "https://github.com/" + REPO + "/new/" + BRANCH + "/" + RECIPE_FOLDER +
            "?filename=" + encodeURIComponent(filename()) +
            "&value=" + encodeURIComponent(buildMarkdown());
  window.open(url, "_blank");
  $("saveStatus").textContent = "GitHub opened with the recipe filled in. Look it over there and tap Commit changes to publish.";
}

function resetAll() {
  if (!confirm("Clear everything and start a new recipe?")) return;
  FIELDS.forEach(function (f) { $(f).value = ""; });
  $("category").value = "";
  $("categoryOther").hidden = true;
  $("thumbs").innerHTML = "";
  $("ocrStatus").textContent = "";
  $("saveStatus").textContent = "";
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
  refresh();
  window.scrollTo(0, 0);
}

/* ---------- Wire it up ---------- */
(function init() {
  var sel = $("category");
  sel.innerHTML = '<option value="">Choose a category...</option>' +
    CATEGORIES.map(function (c) { return '<option>' + c + '</option>'; }).join("") +
    '<option value="__other">New category...</option>';
  sel.addEventListener("change", function () {
    $("categoryOther").hidden = sel.value !== "__other";
    refresh();
  });

  $("camera").addEventListener("change", function (e) { handlePhotos(e.target.files); });
  $("library").addEventListener("change", function (e) { handlePhotos(e.target.files); });
  $("fillBtn").addEventListener("click", function () {
    if (!$("raw").value.trim()) { $("ocrStatus").textContent = "Paste or photograph a recipe first."; return; }
    fillForm(parseRecipe($("raw").value));
    $("step2").scrollIntoView({ behavior: "smooth" });
  });
  $("clearRaw").addEventListener("click", function () { $("raw").value = ""; $("thumbs").innerHTML = ""; $("ocrStatus").textContent = ""; saveDraft(); });
  $("githubBtn").addEventListener("click", openGitHub);
  $("downloadBtn").addEventListener("click", download);
  $("copyBtn").addEventListener("click", copyText);
  $("resetBtn").addEventListener("click", resetAll);

  FIELDS.forEach(function (f) { $(f).addEventListener("input", refresh); });

  loadDraft();
  refresh();
  loadExisting();
})();
</script>
</body>
